<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finanças Pessoais</title>
  <meta name="description" content="Controle de receitas, despesas, categorias e orçamentos mensais. Seus dados ficam só neste dispositivo.">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Modo rápido do widget de voz: marcado antes de desenhar, para o app não piscar por trás. -->
  <script>if (new URLSearchParams(location.search).get('voz') === '1') document.documentElement.classList.add('quick');</script>
</head>
<body>
  <header class="top">
    <p class="brand">Finanças</p>
    <nav class="tabs" aria-label="Principal">
      <button type="button" id="tabBalanco">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h18v11H3zM3 8l3-4h12l3 4M16 13.5h2"/></svg>
        <span>Balanço</span>
      </button>
      <button type="button" id="tabCategorias">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.500 9H15z"/></svg>
        <span>Categorias</span>
      </button>
      <button type="button" id="tabOrcamento">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.500"/><path d="M12 12v.01"/></svg>
        <span>Orçamento</span>
      </button>
    </nav>
    <div class="app-menu-wrap">
      <button type="button" class="icon-btn" id="appMenuBtn" aria-label="Mais opções" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v.01M12 12v.01M12 18.5v.01"/></svg>
      </button>
      <div class="hist-menu app-menu" id="appMenu" role="menu" hidden>
        <button type="button" role="menuitem" id="backupBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 19h14"/></svg>
          <span>Fazer backup</span>
        </button>
      </div>
    </div>
  </header>

  <main class="main" id="view"></main>

  <div class="fab-wrap" id="fabWrap">
    <div class="fab-menu" id="fabMenu" hidden>
      <button type="button" class="btn income" id="addIncome">Receita</button>
      <button type="button" class="btn expense" id="addExpense">Despesa</button>
      <button type="button" class="btn voice" id="addVoice">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        Por voz
      </button>
    </div>
    <button type="button" class="fab" id="fab" aria-label="Adicionar movimentação" aria-expanded="false" aria-controls="fabMenu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <button type="button" class="fab fab-manage" id="manageBtn" aria-label="Gerenciar categorias" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
  </button>

  <dialog id="txDialog" aria-labelledby="txTitle">
    <form id="txForm" novalidate>
      <h2 id="txTitle"></h2>
      <p class="voice-heard" id="txHeard" hidden></p>
      <div class="pay-box" id="txPayBox" hidden></div>
      <label class="field">Valor (R$)
        <input id="txAmount" inputmode="decimal" autocomplete="off" placeholder="0,00" required>
      </label>
      <div class="field" id="txCatField">
        <span id="txCatLabel">Categoria</span>
        <select id="txCat" class="sr-only" tabindex="-1" aria-hidden="true"></select>
        <button type="button" class="cat-select" id="txCatBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="txCatList" aria-labelledby="txCatLabel txCatBtn"></button>
        <div class="cat-picker" id="txCatList" role="listbox" aria-labelledby="txCatLabel" hidden></div>
      </div>
      <label class="field" id="txDescField">Detalhes (opcional)
        <textarea id="txDesc" rows="3" maxlength="300" placeholder="Ex.: corrida até a faculdade"></textarea>
      </label>
      <div class="repeat-field" id="txUntilField" hidden>
        <span class="repeat-label" id="txRepeatLabel">Repetir</span>
        <div class="seg repeat-seg" id="txRepeatSeg" role="tablist" aria-labelledby="txRepeatLabel">
          <button type="button" role="tab" data-mode="once" id="txRepeatOnce">Não repetir</button>
          <button type="button" role="tab" data-mode="monthly" id="txRepeatMonthly">Mensalmente</button>
          <button type="button" role="tab" data-mode="custom" id="txRepeatCustom">Personalizada</button>
        </div>
        <label class="field" id="txUntilWrap" hidden>Até o mês
          <input type="month" id="txUntil">
        </label>
        <div class="field" id="txDatesWrap" hidden>
          <span>Datas</span>
          <div class="date-list" id="txDates"></div>
          <button type="button" class="btn add-date" id="txAddDate">+ Adicionar data</button>
        </div>
      </div>
      <p class="until-note" id="txUntilNote" hidden></p>
      <label class="field" id="txDateField">Data
        <input id="txDate" type="date">
      </label>
      <p class="form-error" id="txError" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="btn danger-ghost" id="txDelete" hidden>Excluir</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="txCancel">Cancelar</button>
        <button type="submit" class="btn primary">Confirmar</button>
      </div>
    </form>
  </dialog>

  <dialog id="payDialog" aria-labelledby="payTitle">
    <div class="dialog-head">
      <span class="dialog-head-spacer" aria-hidden="true"></span>
      <h2 id="payTitle">Pagar despesa futura</h2>
      <button type="button" class="icon-btn" id="payClose" aria-label="Fechar">×</button>
    </div>
    <p class="voice-heard" id="payHeard" hidden></p>
    <div id="payBody"></div>
  </dialog>

  <dialog id="manageDialog" class="wide" aria-labelledby="manageTitle">
    <div class="dialog-head">
      <span class="dialog-head-spacer" aria-hidden="true"></span>
      <h2 id="manageTitle">Gerenciar categorias</h2>
      <button type="button" class="icon-btn" id="manageClose" aria-label="Fechar">×</button>
    </div>
    <div id="manageBody"></div>
  </dialog>

  <dialog id="catDialog" aria-labelledby="catTitle">
    <form id="catForm" novalidate>
      <h2 id="catTitle"></h2>
      <fieldset class="field-set" id="catKindField">
        <legend>Tipo</legend>
        <label><input type="radio" name="catKind" value="main" checked> Categoria principal</label>
        <label><input type="radio" name="catKind" value="sub"> Subcategoria</label>
        <label><input type="radio" name="catKind" value="independent"> Categoria independente</label>
      </fieldset>
      <label class="field">Nome
        <input id="catName" maxlength="60" autocomplete="off">
      </label>
      <div class="field" id="catParentField">
        <span id="catParentLabel">Categoria principal</span>
        <select id="catParent" class="sr-only" tabindex="-1" aria-hidden="true"></select>
        <button type="button" class="cat-select" id="catParentBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="catParentList" aria-labelledby="catParentLabel catParentBtn"></button>
        <div class="cat-picker" id="catParentList" role="listbox" aria-labelledby="catParentLabel" hidden></div>
      </div>
      <div class="field" id="catColorField">
        <span id="catColorLabel">Cor</span>
        <div class="color-grid" id="catColors" role="radiogroup" aria-labelledby="catColorLabel"></div>
      </div>
      <p class="color-note" id="catColorNote" hidden></p>
      <div class="field">
        <span id="catIconLabel">Ícone</span>
        <div class="icon-grid" id="catIcons" role="radiogroup" aria-labelledby="catIconLabel"></div>
      </div>
      <p class="form-error" id="catError" role="alert"></p>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="button" class="btn" id="catCancel">Cancelar</button>
        <button type="submit" class="btn primary">Salvar</button>
      </div>
    </form>
  </dialog>

  <dialog id="subDialog" aria-labelledby="subTitle">
    <div class="dialog-head">
      <span class="dialog-head-spacer" aria-hidden="true"></span>
      <h2 id="subTitle" class="sub-dialog-title"></h2>
      <button type="button" class="icon-btn" id="subClose" aria-label="Fechar">×</button>
    </div>
    <div id="subBody"></div>
  </dialog>

  <dialog id="typeDialog" aria-labelledby="typeTitle">
    <div class="dialog-head">
      <span class="dialog-head-spacer" aria-hidden="true"></span>
      <h2 id="typeTitle" class="sub-dialog-title"></h2>
      <button type="button" class="icon-btn" id="typeClose" aria-label="Fechar">×</button>
    </div>
    <div id="typeBody"></div>
  </dialog>

  <dialog id="histDialog" aria-labelledby="histTitle">
    <div class="dialog-head">
      <span class="dialog-head-spacer" aria-hidden="true"></span>
      <h2 id="histTitle">Editar movimentações</h2>
      <button type="button" class="icon-btn" id="histClose" aria-label="Fechar">×</button>
    </div>
    <p class="hist-sub" id="histSub"></p>
    <div id="histBody"></div>
  </dialog>

  <dialog id="cmpDialog" aria-labelledby="cmpTitle">
    <div class="dialog-head">
      <span class="dialog-head-spacer" aria-hidden="true"></span>
      <h2 id="cmpTitle">Comparar meses</h2>
      <button type="button" class="icon-btn" id="cmpClose" aria-label="Fechar">×</button>
    </div>
    <div id="cmpBody"></div>
  </dialog>

  <dialog id="confirmDialog" aria-labelledby="confirmTitle">
    <form method="dialog">
      <h2 id="confirmTitle"></h2>
      <p id="confirmBody"></p>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button class="btn" value="cancel">Cancelar</button>
        <button class="btn danger" value="ok" id="confirmOk"></button>
      </div>
    </form>
  </dialog>

  <div id="tooltip" class="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
