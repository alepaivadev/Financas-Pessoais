<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Teste da virada de mês</title>
  <style>iframe { width: 1000px; height: 800px; border: 0; }</style>
</head>
<body>
  <pre id="result">rodando</pre>
  <iframe id="app"></iframe>
  <script type="module">
    import { appDriver, deleteDatabase, makeReporter, wait } from './helpers.js';

    // Carrega o app real com um relógio simulado que o teste controla.
    window.fakeNow = new Date(2026, 9, 31, 23, 50).getTime();
    const clock = `<script>
      const RealDate = Date;
      window.Date = class extends RealDate {
        constructor(...args) { if (args.length) super(...args); else super(parent.fakeNow); }
        static now() { return parent.fakeNow; }
      };
    <\/script>`;

    const frame = document.getElementById('app');
    const { check, finish, failures } = makeReporter();
    const { $, doc, text, ready, fill, addTx } = appDriver(frame);
    const money = (id) => text(id).replace(/\s/g, ' ');

    const setClock = async (date) => {
      window.fakeNow = date.getTime();
      doc().dispatchEvent(new frame.contentWindow.Event('visibilitychange'));
      await wait(250);
    };

    async function run() {
      await deleteDatabase();
      const html = await (await fetch('../index.html')).text();
      frame.srcdoc = html.replace('<head>', `<head><base href="${new URL('..', location)}">${clock}`);
      await wait(300);
      await ready();

      check(text('monthLabel') === 'Outubro de 2026' && text('compareBtn') === 'Comparar', 'outubro é o mês atual');
      await addTx('income', '1.000');
      await addTx('expense', '200', 'uber');
      check(money('balance').includes('800,00'), 'outubro acumula as movimentações');

      await setClock(new Date(2026, 10, 1, 0, 5));
      check(text('monthLabel') === 'Novembro de 2026' && text('compareBtn') === 'Comparar', 'dia 1º abre novembro sozinho');
      check(money('balance').includes('0,00') && text('history').includes('Nenhuma movimentação'), 'novembro começa zerado');
      check(!$('nextMonth').disabled, 'dá para avançar para dezembro (mês futuro)');

      await addTx('expense', '50', 'uber');
      check(money('balance').includes('50,00') && text('monthLabel') === 'Novembro de 2026', 'novembro recebe a despesa');

      $('prevMonth').click();
      await wait(100);
      check(text('monthLabel') === 'Outubro de 2026' && text('compareBtn') === 'Comparar', 'outubro aparece como encerrado');
      check(money('balance').includes('800,00'), 'balanço de outubro continua completo');
      check(doc().querySelectorAll('.tx-row').length === 2, 'histórico de outubro não mistura novembro');

      await addTx('income', '10');
      check(text('monthLabel') === 'Novembro de 2026', 'cadastro em mês encerrado usa a data atual');
      check(doc().querySelectorAll('.tx-row').length === 2, 'novembro recebe a movimentação');
      $('prevMonth').click();
      await wait(100);
      check(money('balance').includes('800,00'), 'outubro segue intacto');
      check($('prevMonth').disabled, 'não existe mês antes de outubro');

      const budgetText = (id) => doc().querySelector(`[data-budget="${id}"] .budget-value`)?.textContent;
      $('tabOrcamento').click();
      await wait(100);
      check(!$('budget-uber') && budgetText('uber') === 'Sem limite' && !$('copyBudgets'), 'mês encerrado: orçamento só para consulta');
      $('nextMonth').click();
      await wait(100);
      fill('budget-uber', '300,00');
      await wait(250);
      check($('budget-uber').value === '300,00', 'mês atual: orçamento editável');
      $('tabBalanco').click();
      await wait(100);

      await setClock(new Date(2026, 11, 1, 8, 0));
      check(text('monthLabel') === 'Outubro de 2026', 'quem consulta um mês antigo não é movido');
      check(!$('nextMonth').disabled, 'dezembro fica disponível');
      $('nextMonth').click();
      $('nextMonth').click();
      await wait(100);
      check(text('monthLabel') === 'Dezembro de 2026' && text('compareBtn') === 'Comparar', 'dezembro é o mês atual');
      $('tabOrcamento').click();
      await wait(100);
      check(!$('budget-uber').value, 'orçamento de um mês não vale para outro');
      $('copyBudgets').click();
      await wait(250);
      check($('budget-uber').value === '300,00', 'copiar do mês anterior');
      fill('budget-uber', '200,00');
      await wait(250);
      $('prevMonth').click();
      await wait(100);
      check(!$('budget-uber') && budgetText('uber') === '300,00', 'novembro encerrado mostra o orçamento que teve, sem edição');
      $('nextMonth').click();
      await wait(100);
      check($('budget-uber').value === '200,00', 'dezembro mantém o valor editado');
      $('tabBalanco').click();
      await wait(100);

      await setClock(new Date(2027, 0, 1, 0, 1));
      check(text('monthLabel') === 'Janeiro de 2027', 'a regra se repete na virada do ano');
    }

    run().catch((e) => failures.push(`erro: ${e.stack || e}`)).finally(finish);
  </script>
</body>
</html>
