<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Teste de fluxo</title>
  <style>iframe { width: 1000px; height: 800px; border: 0; }</style>
</head>
<body>
  <pre id="result">rodando</pre>
  <iframe id="app"></iframe>
  <script type="module">
    import { monthLabel, monthOf, today } from '../js/format.js';
    import { appDriver, deleteDatabase, makeReporter, wait } from './helpers.js';
    import { DEFAULT_CATEGORIES } from '../js/categories.js';
    import { replaceAll } from '../js/db.js';

    const frame = document.getElementById('app');
    const { check, finish, failures } = makeReporter();
    const app = appDriver(frame);
    const { $, doc, text, ready, fill, addTx } = app;

    const month = monthOf(today());

    const createV1Database = () => new Promise((resolve, reject) => {
      const request = indexedDB.open('financas-pessoais', 1);
      request.onupgradeneeded = () => {
        const db = request.result;
        const txs = db.createObjectStore('transactions', { keyPath: 'id' });
        const cats = db.createObjectStore('categories', { keyPath: 'id' });
        db.createObjectStore('meta');
        cats.put({ id: 'mercado', name: 'Mercado', kind: 'expense', fixed: false, budgetCents: 5000 });
        cats.put({ id: 'salario', name: 'Salário', kind: 'income', fixed: false, budgetCents: null });
        txs.put({ id: 'antiga', type: 'expense', amountCents: 12300, date: today(), categoryId: 'mercado', description: 'Feira', createdAt: 1 });
        txs.put({ id: 'renda', type: 'income', amountCents: 50000, date: today(), categoryId: 'salario', description: '', createdAt: 2 });
        txs.put({ id: 'demo-1', type: 'expense', amountCents: 999, date: today(), categoryId: 'mercado', description: '', createdAt: 3 });
      };
      request.onsuccess = () => { request.result.close(); resolve(); };
      request.onerror = () => reject(request.error);
    });

    // Grava direto no banco e recarrega o app, já que ele não tem mais tela de backup.
    const resetData = async (data) => {
      await replaceAll(data);
      frame.contentWindow.location.reload();
      await wait(300);
      await ready();
    };
    const openManage = async (tab) => { $('manageBtn').click(); $(tab).click(); await wait(50); };
    const closeManage = () => $('manageClose').click();
    const confirmOk = async () => { await wait(80); $('confirmOk').click(); await wait(300); };
    const historyRow = (name) => [...doc().querySelectorAll('#history .tx-row')].find((r) => r.textContent.includes(name));
    // Editar agora é pelos três pontinhos do card Histórico.
    const editTx = (name) => {
      $('histMore').click();
      $('histEdit').click();
      [...doc().querySelectorAll('#histBody .tx-row')].find((r) => r.textContent.includes(name)).click();
      $('histDialog').close();
    };
    const money = (el) => (el?.textContent ?? '').replace(/\s/g, ' ');

    const newCategory = async (kind, name, parent) => {
      $('newCategory').click();
      doc().querySelector(`input[name="catKind"][value="${kind}"]`).click();
      $('catName').value = name;
      if (parent) $('catParent').value = parent;
      $('catForm').requestSubmit();
      await wait(250);
    };

    async function run() {
      await deleteDatabase();
      await createV1Database();
      frame.src = '../index.html';
      await ready();

      check(money($('balance')).includes('377,00'), 'migração mantém os dados reais e descarta o exemplo');
      check(!!historyRow('Mercado'), 'migração mantém a categoria usada');
      await resetData({ transactions: [], categories: DEFAULT_CATEGORIES, budgets: [] });

      check(money($('balance')).includes('0,00'), 'começa zerado');
      check(text('history').includes('Nenhuma movimentação'), 'histórico vazio');
      check(text('monthLabel') === monthLabel(month) && text('compareBtn') === 'Comparar', 'abre no mês atual');
      check($('nextMonth').disabled, 'não navega para meses futuros');
      check($('appMenu').contains($('backupBtn')) && $('appMenu').hidden && !$('backupDialog'), 'backup só no menu de três pontinhos do topo');
      $('tabOrcamento').click();
      check(!$('view').querySelector('#backupBtn'), 'Orçamento e Categorias sem o botão de download na tela');
      $('tabBalanco').click();
      const box = (el) => el.getBoundingClientRect();
      const titleCenter = box($('monthLabel')).left + box($('monthLabel')).width / 2;
      const viewCenter = box($('view')).left + box($('view')).width / 2;
      check(Math.abs(titleCenter - viewCenter) < 1, 'nome do mês centralizado');

      $('fab').click();
      check(!$('fabMenu').hidden, 'botão + abre o menu');
      doc().body.click();
      check($('fabMenu').hidden, 'clicar fora fecha o menu');

      $('fab').click();
      $('addIncome').click();
      check($('txDialog').open && $('txCatField').hidden && $('txDateField').hidden, 'receita pede só o valor');
      $('txAmount').value = '0';
      $('txForm').requestSubmit();
      await wait(100);
      check($('txDialog').open && text('txError').includes('maior que zero'), 'valor zero é rejeitado');
      $('txCancel').click();

      await addTx('income', '1.000,00');
      check(!$('txDialog').open, 'receita salva fecha a janela');
      check(money($('balance')).includes('1.000,00'), 'saldo sobe com a receita');
      check(money($('tile-income')).includes('1.000,00'), 'total de receitas');

      $('fab').click();
      $('addExpense').click();
      const groups = [...$('txCat').querySelectorAll('optgroup')];
      check(groups.map((g) => g.label).join() === 'Despesas fixas,Despesas variáveis', 'despesa agrupa por categoria principal');
      check(groups[0].children.length === 6 && groups[1].children.length === 2, 'subcategorias no cadastro');
      check([...$('txCat').children].some((o) => o.tagName === 'OPTION' && o.textContent === 'Emergência'), 'Emergência é opção direta');
      check($('txDateField').hidden, 'despesa não pede data');
      $('txAmount').value = '10';
      $('txForm').requestSubmit();
      await wait(100);
      check(text('txError').includes('categoria'), 'despesa exige categoria');
      $('txCancel').click();

      await addTx('expense', '250,50', 'uber');
      await addTx('expense', '100', 'academia');
      await addTx('expense', '50', 'emergencia');
      check(money($('balance')).includes('599,50'), 'saldo = receitas − despesas');
      check(money($('tile-expense')).includes('400,50'), 'total de despesas');
      check(doc().querySelector('#history .tx-row .tx-name').textContent === 'Emergência', 'mais recente no topo');
      check(historyRow('Uber').querySelector('.tx-value').classList.contains('expense'), 'despesa marcada em vermelho');
      check(historyRow('Receita').querySelector('.tx-value').classList.contains('income'), 'receita marcada em verde');
      check(historyRow('Uber').textContent.includes('Despesas variáveis'), 'histórico mostra a categoria principal');

      frame.contentWindow.location.reload();
      await wait(300);
      await ready();
      check(money($('balance')).includes('599,50'), 'dados continuam depois de recarregar');

      editTx('Academia');
      check(!$('txDateField').hidden && $('txAmount').value === '100,00', 'edição carrega valor e data');
      const editedDate = $('txDate').value;
      $('txDate').value = '2026-09-20';
      $('txForm').requestSubmit();
      await wait(100);
      check($('txDialog').open && text('txError').includes('anterior a Outubro de 2026'), 'data anterior a outubro é recusada');
      $('txDate').value = editedDate;
      $('txAmount').value = '150';
      $('txForm').requestSubmit();
      await wait(250);
      check(money($('balance')).includes('549,50'), 'editar atualiza o saldo');
      editTx('Emergência');
      $('txDelete').click();
      await wait(250);
      check(!historyRow('Emergência') && money($('balance')).includes('599,50'), 'excluir atualiza o saldo');
      doc().querySelector('#toast button').click();
      await wait(250);
      check(!!historyRow('Emergência'), 'desfazer restaura');

      $('tabOrcamento').click();
      await wait(100);
      const orcamentoCenter = box($('monthLabel')).left + box($('monthLabel')).width / 2;
      const orcamentoView = box($('view')).left + box($('view')).width / 2;
      check(text('monthLabel') === monthLabel(month) && Math.abs(orcamentoCenter - orcamentoView) < 1, `mês centralizado também em Orçamento e Categorias (diferença ${Math.abs(orcamentoCenter - orcamentoView).toFixed(1)}px)`);
      check(doc().defaultView.getComputedStyle($('compareBtn')).fontSize === '13px', 'botão comparar compacto');
      check(doc().querySelectorAll('.donut .segment').length === 3, 'rosca com 3 categorias');
      check(money(doc().querySelector('.donut-center')).includes('450,50'), 'rosca soma as despesas');
      const card = (id) => doc().querySelector(`[data-category="${id}"]`);
      check(['despesas-fixas', 'despesas-variaveis', 'emergencia'].every(card), 'três cards principais');
      check(money(card('despesas-fixas')).includes('150,00') && money(card('despesas-variaveis')).includes('250,50'), 'total por categoria');
      check(!card('emergencia').querySelector('.cat-arrow'), 'Emergência sem seta');
      card('despesas-fixas').querySelector('.cat-arrow').click();
      check(card('despesas-fixas').classList.contains('open') && !card('despesas-variaveis').classList.contains('open'), 'expandir não afeta os outros cards');
      check(card('despesas-fixas').querySelectorAll('.sub-row').length === 6, 'mostra as subcategorias');
      const academia = card('despesas-fixas').querySelector('[data-sub="academia"]');
      check(!!academia.querySelector('.sub-bar') && !money(academia.querySelector('.sub-row')).includes('150,00'), 'subcategoria mostra barra, não valor');
      academia.querySelector('.sub-row').click();
      check($('subDialog').open && money($('subTotal')).includes('150,00') && money($('subBody').querySelector('.sub-txs')).includes('150,00'), 'tocar na subcategoria abre janela com total e registros');
      $('subClose').click();
      check(!$('subDialog').open, 'fechar a janela da subcategoria');
      await wait(300);
      check(card('despesas-fixas').querySelector('.cat-body > div').offsetHeight > 200, 'card expandido abre de verdade');
      card('despesas-fixas').querySelector('.cat-arrow').click();
      check(!card('despesas-fixas').classList.contains('open'), 'recolher');
      await wait(300);
      check(card('despesas-fixas').querySelector('.cat-body > div').offsetHeight === 0, 'card recolhido fecha de verdade');
      card('despesas-fixas').querySelector('.cat-arrow').click();

      await openManage('manageTabCats');
      const tagOf = (name) => [...doc().querySelectorAll('.manage-row')].find((r) => r.querySelector('.manage-name').textContent === name);
      check(tagOf('Despesas fixas').textContent.includes('Principal') && !tagOf('Uber').querySelector('.tag') && !tagOf('Emergência').querySelector('.tag'), 'só a categoria principal tem etiqueta');
      await newCategory('main', 'Pets');
      await newCategory('sub', 'Ração', doc().querySelector('#catParent option:last-child').value);
      await newCategory('independent', 'Viagem');
      check(!!tagOf('Pets') && tagOf('Ração').classList.contains('child') && !!tagOf('Viagem'), 'cria principal, subcategoria e independente');
      await newCategory('independent', 'viagem');
      check($('catDialog').open && text('catError').includes('Já existe'), 'nome repetido é recusado');
      $('catCancel').click();

      doc().querySelector('[aria-label="Editar Ração"]').click();
      check($('catKindField').hidden && !$('catParentField').hidden, 'edição da subcategoria mostra a principal');
      $('catName').value = 'Veterinário';
      $('catParent').value = 'despesas-variaveis';
      $('catForm').requestSubmit();
      await wait(250);
      const rows = [...doc().querySelectorAll('.manage-row')].map((r) => r.querySelector('.manage-name').textContent);
      check(rows.indexOf('Veterinário') > rows.indexOf('Despesas variáveis') && rows.indexOf('Veterinário') < rows.indexOf('Emergência'), 'renomeia e troca a categoria principal');

      doc().querySelector('[aria-label="Excluir Internet"]').click();
      await wait(250);
      check(!$('confirmDialog').open && !tagOf('Internet'), 'categoria sem uso sai direto');
      doc().querySelector('[aria-label="Excluir Academia"]').click();
      await wait(80);
      check($('confirmDialog').open && text('confirmBody').includes('continuará'), 'categoria em uso pede confirmação');
      await confirmOk();
      check(!tagOf('Academia'), 'categoria sai da lista');

      $('manageTabBudget').click();
      await wait(50);
      check(!!doc().querySelector('[data-budget="emergencia"] input') && !!doc().querySelector('[data-budget="uber"] input') && !!doc().querySelector('[data-budget="despesas-variaveis"]') && !$('budget-despesas-variaveis'), 'orçamento: principal sem caixa, subcategorias e Emergência com caixa');
      closeManage();

      card('despesas-fixas');
      check(money(card('despesas-fixas')).includes('150,00'), 'excluir categoria preserva o total do mês');
      check([...card('despesas-fixas').querySelectorAll('.sub-row')].some((r) => r.textContent.includes('Academia')), 'excluída continua no mês em que teve gasto');
      $('tabBalanco').click();
      await wait(100);
      check(!!historyRow('Academia'), 'histórico preserva a movimentação');
      $('fab').click();
      $('addExpense').click();
      check(![...$('txCat').options].some((o) => o.textContent === 'Academia'), 'excluída não aparece em novos cadastros');
      $('txCancel').click();
      editTx('Academia');
      check($('txCat').value === 'academia', 'edição antiga mantém a categoria excluída');
      $('txCancel').click();
      $('tabOrcamento').click();
      await wait(100);

      await openManage('manageTabBudget');
      fill('budget-uber', '200,00');
      await wait(250);
      check($('budget-uber').value === '200,00', 'orçamento salvo');
      check(!doc().querySelector('.budget-stats') && !doc().querySelector('[data-budget="uber"] .over'), 'orçamento mostra só nome, ícone e valor');
      closeManage();
      check(money(doc().querySelector('.donut-center')).includes('450,50'), 'orçamento não duplica o total de despesas');

      await replaceAll({
        categories: [{ id: 'x', name: 'Importada', kind: 'independent', parentId: null, order: 0 }],
        budgets: [],
        transactions: [
          { id: 'i1', type: 'expense', amountCents: 4200, date: today(), categoryId: 'x', description: '', createdAt: 1 },
          { id: 'i2', type: 'expense', amountCents: 9900, date: '2026-09-15', categoryId: 'x', description: '', createdAt: 2 },
        ],
      });
      frame.contentWindow.location.reload();
      await wait(300);
      await ready();
      while (!$('prevMonth').disabled && $('monthLabel').textContent !== 'Outubro de 2026') { $('prevMonth').click(); await wait(50); }
      check($('prevMonth').disabled, 'outubro é o primeiro mês disponível');
      const stored = await new Promise((resolve, reject) => {
        const request = indexedDB.open('financas-pessoais');
        request.onsuccess = () => {
          const all = request.result.transaction('transactions').objectStore('transactions').getAll();
          all.onsuccess = () => { request.result.close(); resolve(all.result.map((t) => t.id)); };
          all.onerror = () => reject(all.error);
        };
        request.onerror = () => reject(request.error);
      });
      check(stored.join() === 'i1', 'registro anterior a outubro é apagado');
      $('tabOrcamento').click();
      await wait(100);


      const worker = await frame.contentWindow.navigator.serviceWorker.ready;
      check(!!worker.active, 'service worker ativo');
      check(!!await frame.contentWindow.caches.match('js/categories.js'), 'app em cache para uso offline');
    }

    run().catch((e) => failures.push(`erro: ${e.stack || e}`)).finally(finish);
  </script>
</body>
</html>
